<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Practical accounting and finance articles by Sahil Pekde"><title>Blogs | Finance with Sahil</title><style> :root{--navy:#0b1730;--ink:#14233b;--muted:#617089;--teal:#20c5b5;--bg:#f4f7fc;--line:#dce4ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 Inter,system-ui,Segoe UI,Arial,sans-serif}a{color:inherit;text-decoration:none}.container{width:min(1120px,calc(100% - 36px));margin:auto}.topbar{background:var(--navy);color:white;position:sticky;top:0;z-index:5}.nav{display:flex;justify-content:space-between;align-items:center;gap:18px;min-height:75px;flex-wrap:wrap}.brand{font-size:1.15rem;font-weight:850}.brand span{color:var(--teal)}.links{display:flex;gap:20px;flex-wrap:wrap;font-size:.92rem}.links a:hover,.links .active{color:var(--teal)}.hero{background:linear-gradient(120deg,#0b1730,#14294d);color:white;padding:65px 0}.hero h1{font-size:clamp(2rem,4vw,3.4rem);margin:4px 0}.hero p{color:#c9d6e9;max-width:760px}.eyebrow{font-size:.78rem;color:#48d9ca;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.main{padding:50px 0 85px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.card,.article{background:#fff;border:1px solid var(--line);border-radius:17px;padding:28px;box-shadow:0 12px 35px #0e20410c}.card h2{margin:8px 0;font-size:1.3rem}.card p,.muted{color:var(--muted)}.tag{display:inline-block;background:#e8f8f6;color:#087d76;padding:5px 10px;border-radius:20px;font-size:.78rem;font-weight:750}.btn{display:inline-block;border:0;border-radius:10px;background:var(--teal);color:#08232c;padding:11px 17px;font-weight:750;cursor:pointer}.article{max-width:850px;margin:auto}.article h2{margin-top:34px}.article p{line-height:1.85}.article table{border-collapse:collapse;width:100%}.article td,.article th{padding:11px;border:1px solid var(--line);text-align:left}.article th{background:#eff5fb}.note{background:#eff8f8;border-left:4px solid var(--teal);padding:16px;border-radius:8px}.feedback{border-top:1px solid var(--line);margin-top:40px;padding-top:24px}.reactions{display:flex;gap:10px;flex-wrap:wrap}.reactions button{background:white;border:1px solid #b8c8d8;border-radius:9px;padding:10px 16px;cursor:pointer}.reactions button.selected{background:#dff7f3;border-color:#087f79}.video-thumb{width:100%;aspect-ratio:16/9;border-radius:11px;object-fit:cover;background:#0b1730}.video-card{display:block}.footer{background:var(--navy);color:#d3deed;padding:26px 0}.footer a{color:#64e0d3}.empty{padding:26px;background:white;border:1px dashed #b9c9d9;border-radius:14px}.search{width:100%;padding:12px;border:1px solid #b9c9d9;border-radius:9px;max-width:400px;margin-bottom:25px}.video-embed{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;background:#0b1730}@media(max-width:650px){.nav{padding:14px 0}.links{gap:12px}.hero{padding:45px 0}.card,.article{padding:20px}} </style></head><body><header class="topbar"><nav class="container nav" aria-label="Main navigation"><a class="brand" href="/">Finance <span>with Sahil</span></a><div class="links"><a href="/">Home</a><a href="/#learn">Learn Finance</a><a href="/#calculators">Calculators</a><a href="/blog/" class="active">Blogs</a><a href="/videos/" class="">Videos</a><a href="/#about">About</a></div></nav></header><section class="hero"><div class="container"><div class="eyebrow">Finance with Sahil · Knowledge Library</div><h1>Finance Blogs</h1><p>Practical finance articles, journal entries, worked examples and concepts explained clearly.</p></div></section><main class="main"><div class="container"><input class="search" id="search" type="search" placeholder="Search blog articles…" aria-label="Search blog articles"><div id="articles" class="cards"></div><p id="empty" class="empty" hidden>No matching articles yet.</p><script src="/content/blogs.js"></script><script>(function(){const list=document.getElementById('articles'),search=document.getElementById('search'),empty=document.getElementById('empty');function draw(){const q=search.value.toLowerCase();const rows=(window.FWS_BLOGS||[]).filter(x=>[x.title,x.summary,x.category].join(' ').toLowerCase().includes(q));list.replaceChildren();empty.hidden=rows.length>0;for(const x of rows){const a=document.createElement('a');a.href='/blog/'+encodeURIComponent(x.slug)+'/';a.className='card';const tag=document.createElement('span');tag.className='tag';tag.textContent=x.category;const h=document.createElement('h2');h.textContent=x.title;const p=document.createElement('p');p.textContent=x.summary;const meta=document.createElement('small');meta.className='muted';meta.textContent=x.date+' · Read article →';a.append(tag,h,p,meta);list.append(a)}}search.addEventListener('input',draw);draw()})();</script></div></main><footer class="footer"><div class="container">© <span id="year"></span> Finance with Sahil · Sahil Pekde · <a href="/">Home</a></div></footer><script>document.getElementById('year').textContent=new Date().getFullYear()</script></body></html>
